name: Nightly update from the Numbers.sg API

on:
  schedule:
    - cron: "20 16 * * *"   # 00:20 Singapore time, after the API's 23:50 nightly copy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild from the API
        id: build
        run: python3 scripts/update.py
      - name: Check the new copy before committing it
        if: steps.build.outputs.changed != ''
        run: python3 scripts/validate.py
      - name: Commit if the rows changed
        if: steps.build.outputs.changed != ''
        run: |
          git config user.name "numbers-sg-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Data: ${{ steps.build.outputs.changed }} ($(TZ=Asia/Singapore date +%F))"
          git push
